# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: groundwork
    runtime: python
    plan: starter            # persistent disks need a paid instance
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/auth/me
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROUNDWORK_DATA
        value: /var/data
      - key: GROUNDWORK_SECURE_COOKIES
        value: "1"
      - key: ANTHROPIC_API_KEY   # optional: leave blank to run in offline mode
        sync: false
    disk:
      name: groundwork-data
      mountPath: /var/data
      sizeGB: 1

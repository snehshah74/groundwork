<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Groundwork app</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23074ce0'/%3E%3Cpath d='M9 24l5-16h3l-5 16zM15 24l5-16h3l-5 16z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#/home" aria-label="Groundwork home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 29L11 3h5L8 29zM12 29L20 3h5l-8 26zM21 29L29 3h3l-8 26z" fill="currentColor"/></svg>
      <span class="brand-name">Groundwork</span>
    </a>
    <nav class="nav" aria-label="Workspace">
      <a href="#/home" data-nav="home">Home</a>
      <a href="#/canvas" data-nav="canvas">Canvas</a>
      <a href="#/priorities" data-nav="priorities">Priorities</a>
      <a href="#/governance" data-nav="governance">Governance</a>
      <a href="#/integrations" data-nav="integrations">Integrations</a>
      <a href="#/team" data-nav="team">Team</a>
    </nav>
    <div class="nav-gap"></div>
    <nav class="spine" aria-label="From evidence to initiatives">
      <a href="#/evidence" data-nav="evidence" style="--stage: var(--c-evidence)">Evidence <span class="count" id="n-evidence"></span></a>
      <a href="#/problems" data-nav="problems" style="--stage: var(--c-problem)">Problems <span class="count" id="n-problems"></span></a>
      <a href="#/strategy" data-nav="strategy" style="--stage: var(--c-theme)">Strategy <span class="count" id="n-themes"></span></a>
      <a href="#/initiatives" data-nav="initiatives" style="--stage: var(--c-initiative)">Initiatives <span class="count" id="n-initiatives"></span></a>
    </nav>
    <div class="rail-foot">
      <button class="btn primary" data-act="ask-open" type="button">Ask Velo</button>
      <div class="ai-state" id="ai-state"></div>
      <button class="link-quiet" data-act="reset-workspace" type="button">Reset workspace</button>
      <div class="account">
        <label class="ws-switch"><span class="visually-hidden">Workspace</span><select id="ws-switch" data-change="ws-switch" aria-label="Workspace"></select></label>
        <div class="who"><b id="acct-name"></b><span id="acct-email"></span></div>
        <button class="link-quiet" data-act="logout" type="button">Log out</button>
      </div>
    </div>
  </aside>
  <main id="main" tabindex="-1" aria-live="polite"></main>
</div>

<section class="ask" id="ask" aria-label="Ask Velo" aria-hidden="true">
  <div class="ask-head"><b>Ask Velo</b><button class="icon-btn" data-act="ask-close" type="button" aria-label="Close">&#10005;</button></div>
  <div class="ask-log" id="ask-log"></div>
  <div class="ask-suggest" id="ask-suggest"></div>
  <form class="ask-form" id="ask-form">
    <input id="ask-input" type="text" placeholder="Ask about your evidence, problems or plan" autocomplete="off" aria-label="Your question">
    <button class="btn primary" type="submit">Send</button>
  </form>
</section>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/static/app.js"></script>
<script src="/static/team.js"></script>
<script src="/static/priorities.js"></script>
<script src="/static/governance.js"></script>
<script src="/static/onboarding.js"></script>
<script src="/static/integrations.js"></script>
<script src="/static/docs.js"></script>
<script src="/static/views.js"></script>
</body>
</html>

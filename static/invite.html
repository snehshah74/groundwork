<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="mark" viewBox="0 0 32 32"><path d="M3 29L11 3h5L8 29zM12 29L20 3h5l-8 26zM21 29L29 3h3l-8 26z" fill="currentColor"/></symbol></defs></svg>
<main class="auth-main" style="min-height:100vh">

    <p class="sub" id="m">Checking your invite...</p>
    <div class="form-error" id="err" role="alert"></div>
    <div id="act" class="stack-12" hidden><button class="btn primary block" id="accept" type="button">Join workspace</button>
      <button class="btn block" id="switch" type="button" hidden>Log out and use another account</button></div>
  </div>
</main>
<script type="module" src="/static/invite.js"></script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Groundwork</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23074ce0'/%3E%3Cpath d='M9 24l5-16h3l-5 16zM15 24l5-16h3l-5 16z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="mark" viewBox="0 0 32 32"><path d="M3 29L11 3h5L8 29zM12 29L20 3h5l-8 26zM21 29L29 3h3l-8 26z" fill="currentColor"/></symbol></defs></svg>
<main class="auth-main" style="min-height:100vh">
  <div class="auth-card">
    <a class="logo" href="/" style="margin-bottom:28px"><svg style="color:var(--dp-color-accent);width:28px;height:28px" aria-hidden="true"><use href="#mark"/></svg>Groundwork</a>
    <h1 id="t">Reset your password</h1>
    <p class="sub" id="m">Enter your email and we will send a link to choose a new password.</p>
    <div class="form-error" id="err" role="alert"></div>
    <div class="form-note" id="ok" role="status"></div>
    <form id="ask" novalidate>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" required></div>
      <button class="btn primary block" type="submit">Send reset link</button>
    </form>
    <form id="set" novalidate hidden>
      <div class="field"><label for="pw">New password</label><input class="input" id="pw" type="password" autocomplete="new-password" required><span class="hint">Use at least 8 characters.</span></div>
      <button class="btn primary block" type="submit">Save new password</button>
    </form>
    <p class="alt"><a href="/login">Back to log in</a></p>
  </div>
</main>
<script type="module" src="/static/reset.js"></script>
</body>
</html>
